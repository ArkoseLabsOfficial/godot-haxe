name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      # `site_scons` makes SCons use a response file for the binding archive:
      # the generated command line exceeds Linux's argument-size limit, and
      # SCons's `ar` tool does not apply the `$TEMPFILE` workaround that its
      # link command already uses. See the file for details.
      run: scons --directory=./godot-cpp/test --site-dir="${{ github.workspace }}/.github/actions/godot-cpp-build/site_scons" "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
